x-database-environment: &database-environment
  APP_ENV: ${APP_ENV:?Set APP_ENV to development, test, or production}
  DATABASE_PATH: /data/running-drafts.sqlite3
  DATABASE_BUSY_TIMEOUT_MS: ${DATABASE_BUSY_TIMEOUT_MS:-5000}

services:
  api:
    build:
      context: .
      target: api
    environment:
      <<: *database-environment
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS to a JSON array}'
      PUBLIC_EDITOR_URL: ${PUBLIC_EDITOR_URL:?Set PUBLIC_EDITOR_URL to the editor origin}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      TEST_CONTROL_BOOTSTRAP_CREDENTIAL: ${TEST_CONTROL_BOOTSTRAP_CREDENTIAL:-}
      TEST_CONTROL_DERIVATION_KEY: ${TEST_CONTROL_DERIVATION_KEY:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      DATABASE_MIN_FREE_BYTES: ${DATABASE_MIN_FREE_BYTES:?Set DATABASE_MIN_FREE_BYTES}
      DOWNLOAD_STAGING_DIRECTORY: ${DOWNLOAD_STAGING_DIRECTORY:?Set DOWNLOAD_STAGING_DIRECTORY}
      STAGING_MIN_FREE_BYTES: ${STAGING_MIN_FREE_BYTES:?Set STAGING_MIN_FREE_BYTES}
      MAX_STAGED_DOWNLOAD_FILES: ${MAX_STAGED_DOWNLOAD_FILES:?Set MAX_STAGED_DOWNLOAD_FILES}
      MAX_TRANSPORT_FRAME_BYTES: ${MAX_TRANSPORT_FRAME_BYTES:?Set MAX_TRANSPORT_FRAME_BYTES}
      ACCOUNT_REQUESTS_PER_MINUTE: ${ACCOUNT_REQUESTS_PER_MINUTE:?Set ACCOUNT_REQUESTS_PER_MINUTE}
      ACCOUNT_REQUEST_BURST: ${ACCOUNT_REQUEST_BURST:?Set ACCOUNT_REQUEST_BURST}
      PROCESS_REQUESTS_PER_MINUTE: ${PROCESS_REQUESTS_PER_MINUTE:?Set PROCESS_REQUESTS_PER_MINUTE}
      PROCESS_REQUEST_BURST: ${PROCESS_REQUEST_BURST:?Set PROCESS_REQUEST_BURST}
      MAX_ACCOUNT_CONCURRENT_FRAME_UPLOADS: ${MAX_ACCOUNT_CONCURRENT_FRAME_UPLOADS:?Set MAX_ACCOUNT_CONCURRENT_FRAME_UPLOADS}
      MAX_PROCESS_CONCURRENT_FRAME_UPLOADS: ${MAX_PROCESS_CONCURRENT_FRAME_UPLOADS:?Set MAX_PROCESS_CONCURRENT_FRAME_UPLOADS}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - application-data:/data
      - download-staging:/staging
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  db-admin:
    profiles: [tools]
    build:
      context: .
      target: db-admin
    environment:
      <<: *database-environment
    volumes:
      - application-data:/data

volumes:
  application-data:
  download-staging:
